<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملاذ القهوة - اطلب الآن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>اطلب الآن</h1>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="menu.html">قائمة المشروبات</a></li>
                <li><a href="order.html" class="active">اطلب الآن</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>أرسل طلبك لتجهيزه</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="customerName">اسم العميل:</label>
                <input type="text" id="customerName" name="customerName" required>
            </div>

            <div class="form-group">
                <label for="coffeeType">نوع القهوة:</label>
                <select id="coffeeType" name="coffeeType" required>
                    <option value="">اختر النوع...</option>
                    <option value="Latte">لاتيه</option>
                    <option value="Cappuccino">كابتشينو</option>
                    <option value="Americano">قهوة أمريكية</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">الكمية:</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1" required>
            </div>

            <button type="submit">تأكيد الطلب</button>
            <p id="confirmationMessage" class="hidden"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 عالم القهوة ، جميع الحقوق محفوظة.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
